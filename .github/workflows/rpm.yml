name: Build & Deploy RPM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features app-powerd/wayland
      - run: cargo test --workspace --features app-powerd/wayland

  rpm:
    name: RPM (${{ matrix.distro.name }}, ${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ${{ matrix.distro.image }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        distro:
          - name: fedora-43
            image: registry.fedoraproject.org/fedora:43
            family: dnf
            targets: fedora/43
          - name: fedora-44
            image: registry.fedoraproject.org/fedora:44
            family: dnf
            targets: fedora/44
          - name: fedora-45
            image: registry.fedoraproject.org/fedora:45
            family: dnf
            targets: fedora/45
          - name: el10
            image: quay.io/centos/centos:stream10
            family: dnf
            targets: centos-stream/10 rhel/10
          - name: opensuse-tumbleweed
            image: registry.opensuse.org/opensuse/tumbleweed:latest
            family: zypper
            targets: opensuse-tumbleweed/rolling opensuse-microos/rolling
          - name: opensuse-leap-16.0
            image: registry.opensuse.org/opensuse/leap:16.0
            family: zypper
            targets: opensuse-leap/16.0
          - name: opensuse-leap-16.1
            image: registry.opensuse.org/opensuse/leap:16.1
            family: zypper
            targets: opensuse-leap/16.1
    steps:
      - name: Install build dependencies
        run: |
          if [ "${{ matrix.distro.family }}" = dnf ]; then
            dnf -y install --allowerasing rpm-build gcc git tar gzip curl
          else
            zypper -n --gpg-auto-import-keys install rpm-build gcc git tar gzip curl
          fi

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro.name }}-${{ matrix.arch }}

      - name: Build RPM
        run: packaging/rpm/build.sh "${{ github.run_number }}"

      - name: Record upload targets
        run: echo "${{ matrix.distro.targets }}" > dist-rpm/targets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.distro.name }}-${{ matrix.arch }}
          path: dist-rpm/
          if-no-files-found: error

  publish:
    name: Publish to repo.hallb.me
    needs: rpm
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: rpm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          path: artifacts
      - name: Upload RPMs
        env:
          RPM_REPO_TOKEN: ${{ secrets.RPM_REPO_TOKEN }}
        run: packaging/rpm/publish.sh artifacts
